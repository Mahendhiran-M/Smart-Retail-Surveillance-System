name: smart_retail_app
description: Enterprise Smart Retail Surveillance App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.1.0            # Updated for better Dart 3 compatibility

  # State Management
  provider: ^6.0.5        # To manage app state (User login, etc.)

  # Local Storage
  shared_preferences: ^2.2.0  # To remember the user's login token

  # Video Streaming
  # We use flutter_mjpeg because standard video players often struggle 
  # with the MJPEG format that Python webcams use.
  flutter_mjpeg: ^2.0.4
  
  # UI Utilities
  intl: ^0.18.1           # For formatting dates (e.g., "2023-10-15")
  cupertino_icons: ^1.0.2

dev_dependencies: 
  flutter_test:
    sdk: flutter
  
  # ✅ ADDED THIS TO FIX YOUR ERROR
  flutter_lints: ^3.0.0
  
  flutter_launcher_icons: ^0.13.1  

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.jpeg"
  min_sdk_android: 21 # Recommended

flutter:
  uses-material-design: true
  
  # We will add assets later if needed
  # assets:
  #   - assets/images/